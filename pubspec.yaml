name: caua_loves_candies
description: Cauã Loves Candies, a Flutter + Flame birthday arcade game.

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flame: ^1.18.0
  flutter:
    sdk: flutter

  audioplayers: ^6.0.0
  flame_audio: ^2.10.2
  go_router: ^16.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  nes_ui: ^0.24.1
  google_fonts: ^6.2.0
  logging: ^1.2.0

dev_dependencies:
  flame_test: ^2.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  test: ^1.25.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/music/
    - assets/sfx/

  fonts:
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/Press_Start_2P/PressStart2P-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
